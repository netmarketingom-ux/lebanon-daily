# Reads the news websites' RSS feeds every 3 hours and saves the new news.json.
# Free: no API key or secret needed.
# You can also run it by hand: GitHub -> Actions -> "Update news" -> "Run workflow".
name: Update news

on:
  schedule:
    # Times are UTC: every 3 hours, at 17 minutes past the hour.
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write   # lets the job commit the updated news.json

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read the news feeds
        run: npm run update-news

      - name: Save news.json if it changed
        run: |
          if git diff --quiet news.json; then
            echo "No change in news."
            exit 0
          fi
          git config user.name "news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git commit -m "Update news"
          git push
