# Runs the news agent three times a day and saves the new news.json.
# You can also run it by hand: GitHub -> Actions -> "Update news" -> "Run workflow".
# Needs a repository secret named ANTHROPIC_API_KEY (see README.md).
name: Update news

on:
  schedule:
    # Times are UTC. 05:17, 11:17, 17:17 UTC = about 7am, 1pm, 7pm in Beirut.
    - cron: "17 5,11,17 * * *"
  workflow_dispatch:

permissions:
  contents: write   # lets the job commit the updated news.json

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install the Anthropic SDK
        run: npm ci

      - name: Ask Claude for today's news
        run: npm run update-news
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Save news.json if it changed
        run: |
          if git diff --quiet news.json; then
            echo "No change in news."
            exit 0
          fi
          git config user.name "news-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git commit -m "Update news"
          git push
